# .github/workflows/snake.yml
# Generates the GitHub contribution-grid "snake" and publishes it to the `output` branch.
# The profile README references: output/github-contribution-grid-snake-dark.svg
name: Generate Snake

"on":
  # Refresh on a schedule (every 12 hours) so the snake tracks recent contributions.
  schedule:
    - cron: "0 */12 * * *"
  # Allow manual runs from the Actions tab — use this ONCE to create the `output` branch.
  workflow_dispatch:
  # Regenerate on every push to the default branch.
  push:
    branches:
      - main

# The job commits generated SVGs to a branch, so it needs write access to repo contents.
permissions:
  contents: write

# Never run two generations at once; cancel an in-flight run if a newer one starts.
concurrency:
  group: snake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs from the contribution grid
        uses: Platane/snk@v3
        id: snake-gen
        with:
          # Build the grid for THIS profile's contributions.
          github_user_name: ssstrickys
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Output files. The dark filename MUST match the README <img> src exactly.
          # Exactly 5 comma-separated dot colors are required by snk.
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#ff3131&color_dots=#161b22,#5a0d0d,#8b0000,#d61f1f,#ff3131
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#8b0000

      - name: Publish SVGs to the `output` branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          # Push the generated dist/ contents to a dedicated branch served as raw files.
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
